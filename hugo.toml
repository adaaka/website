# ─────────────────────────────────────────────────────────────
#  Site settings. Most edits happen in the content/ folder —
#  see EDITING.md. Change things here only for the site name,
#  the menu, or the links shown on the homepage.
# ─────────────────────────────────────────────────────────────

baseURL = "https://adaaka.com/"
title = "Ada Aka"
locale = "en-us"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Ada Aka is an assistant professor of marketing at Stanford Graduate School of Business."
  email = "adaaka@stanford.edu"

  # Links shown under the bio on the homepage (in this order).
  [[params.links]]
    name = "CV"
    url = "https://www.gsb.stanford.edu/sites/default/files/faculty/cv/AdaAka_CV_Oct2026_w.pdf"
  [[params.links]]
    name = "Google Scholar"
    url = "https://scholar.google.com/citations?user=aWWklnMAAAAJ&hl=en"
  [[params.links]]
    name = "Bluesky"
    url = "https://bsky.app/profile/adaaka.bsky.social"
  [[params.links]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/adaaka/"
  [[params.links]]
    name = "Twitter"
    url = "https://twitter.com/AdaAka18"

# Top navigation menu.
[menus]
  [[menus.main]]
    name = "Research"
    pageRef = "/papers"
    weight = 1
  [[menus.main]]
    name = "Teaching"
    pageRef = "/teaching"
    weight = 2
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

# Each paper is shown on the Papers page; it doesn't get a page of its own.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "local"
  [cascade.target]
    path = "/papers/**"
